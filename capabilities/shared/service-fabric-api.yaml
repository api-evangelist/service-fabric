naftiko: "1.0.0-alpha1"

info:
  label: "Service Fabric Cluster Management API"
  description: >-
    Service Fabric REST API v9.1 for cluster management, application lifecycle,
    node management, service management, and health monitoring.
  tags:
    - Distributed Systems
    - Cluster Management
    - Application Lifecycle
    - Health Monitoring
    - Microservices
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SF_CLUSTER_ENDPOINT: SF_CLUSTER_ENDPOINT

capability:
  consumes:
    - type: http
      namespace: sf-api
      baseUri: "http://{{SF_CLUSTER_ENDPOINT}}:19080"
      description: "Service Fabric HTTP Gateway"
      resources:
        - name: cluster-health
          path: /$/GetClusterHealth
          description: "Cluster health state"
          operations:
            - name: get-cluster-health
              method: GET
              description: "Returns the health state of the entire Service Fabric cluster"
              inputParameters:
                - name: api-version
                  in: query
                  type: string
                  required: true
                  description: "API version (9.1)"
                - name: NodesHealthStateFilter
                  in: query
                  type: integer
                  required: false
                  description: "Health state filter for nodes"
                - name: ApplicationsHealthStateFilter
                  in: query
                  type: integer
                  required: false
                  description: "Health state filter for applications"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: nodes
          path: /Nodes
          description: "Cluster node listing"
          operations:
            - name: get-node-info-list
              method: GET
              description: "Returns the list of nodes in the Service Fabric cluster"
              inputParameters:
                - name: api-version
                  in: query
                  type: string
                  required: true
                  description: "API version"
                - name: NodeStatusFilter
                  in: query
                  type: string
                  required: false
                  description: "Filter nodes by status (up, down, all, etc.)"
                - name: MaxResults
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results to return"
                - name: ContinuationToken
                  in: query
                  type: string
                  required: false
                  description: "Pagination continuation token"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: node
          path: /Nodes/{nodeName}
          description: "Individual node information"
          operations:
            - name: get-node-info
              method: GET
              description: "Returns information about a specific cluster node"
              inputParameters:
                - name: nodeName
                  in: path
                  type: string
                  required: true
                  description: "Node name"
                - name: api-version
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: applications
          path: /Applications
          description: "Application listing"
          operations:
            - name: get-application-info-list
              method: GET
              description: "Returns the list of applications in the cluster"
              inputParameters:
                - name: api-version
                  in: query
                  type: string
                  required: true
                - name: ApplicationTypeName
                  in: query
                  type: string
                  required: false
                  description: "Filter by application type name"
                - name: ContinuationToken
                  in: query
                  type: string
                  required: false
                - name: MaxResults
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: application
          path: /Applications/{applicationId}
          description: "Individual application operations"
          operations:
            - name: get-application-info
              method: GET
              description: "Returns information about a specific application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                  description: "Application ID"
                - name: api-version
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: create-application
          path: /Applications/$/Create
          description: "Create a new application"
          operations:
            - name: create-application
              method: POST
              description: "Creates a Service Fabric application"
              inputParameters:
                - name: api-version
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Name: "{{tools.name}}"
                  TypeName: "{{tools.type_name}}"
                  TypeVersion: "{{tools.type_version}}"

        - name: delete-application
          path: /Applications/{applicationId}/$/Delete
          description: "Delete an application"
          operations:
            - name: delete-application
              method: POST
              description: "Deletes a Service Fabric application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                - name: api-version
                  in: query
                  type: string
                  required: true
                - name: ForceRemove
                  in: query
                  type: boolean
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: application-health
          path: /Applications/{applicationId}/$/GetHealth
          description: "Application health state"
          operations:
            - name: get-application-health
              method: GET
              description: "Returns health state for a specific application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                - name: api-version
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: services
          path: /Applications/{applicationId}/$/GetServices
          description: "Services within an application"
          operations:
            - name: get-service-info-list
              method: GET
              description: "Returns services in a specific application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                - name: api-version
                  in: query
                  type: string
                  required: true
                - name: ServiceTypeName
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: sf-rest
      resources:
        - path: /v1/cluster/health
          name: cluster-health
          description: "Cluster health state"
          operations:
            - method: GET
              name: get-cluster-health
              description: "Get cluster health"
              call: "sf-api.get-cluster-health"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/nodes
          name: nodes
          description: "Cluster nodes"
          operations:
            - method: GET
              name: get-node-info-list
              description: "List cluster nodes"
              call: "sf-api.get-node-info-list"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/applications
          name: applications
          description: "Cluster applications"
          operations:
            - method: GET
              name: get-application-info-list
              description: "List applications"
              call: "sf-api.get-application-info-list"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-application
              description: "Create an application"
              call: "sf-api.create-application"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: sf-mcp
      transport: http
      tools:
        - name: get-cluster-health
          description: "Get the overall health state of the Service Fabric cluster"
          hints:
            readOnly: true
            idempotent: true
          call: "sf-api.get-cluster-health"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-nodes
          description: "List all nodes in the Service Fabric cluster with status filtering"
          hints:
            readOnly: true
            idempotent: true
          call: "sf-api.get-node-info-list"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-applications
          description: "List all applications deployed in the Service Fabric cluster"
          hints:
            readOnly: true
            idempotent: true
          call: "sf-api.get-application-info-list"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-application-health
          description: "Get the health state of a specific application and its services"
          hints:
            readOnly: true
            idempotent: true
          call: "sf-api.get-application-health"
          with:
            applicationId: "tools.application_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-application
          description: "Deploy a new application to the Service Fabric cluster"
          hints:
            readOnly: false
            idempotent: false
          call: "sf-api.create-application"
          outputParameters:
            - type: object
              mapping: "$."
